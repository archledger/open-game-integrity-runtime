name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository metadata
        run: |
          ./scripts/test-repository-metadata.sh
          ./scripts/check-repository-metadata.sh

      - name: Check ADR documentation
        run: |
          ./scripts/test-adr-index.sh
          ./scripts/check-adr-index.sh

      - name: Check GitHub bootstrap
        run: ./scripts/test-bootstrap-github.sh

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Show tool versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Compile-check the C SDK header
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -fsyntax-only -x c - <<'EOF'
          #include "sdk/include/ogir.h"
          int main(void) {
              ogir_session *session = 0;
              (void)session;
              return 0;
          }
          EOF
