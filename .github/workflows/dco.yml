name: DCO

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  statuses: write

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: signoff
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the trusted base commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull-request commit objects without checkout
        id: fetch
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! "${BASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid pull-request base commit" >&2
            exit 2
          fi
          if [[ ! "${HEAD_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid pull-request head commit" >&2
            exit 2
          fi
          if [[ ! "${PULL_REQUEST_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid pull-request number" >&2
            exit 2
          fi
          if [[ "${PULL_REQUEST_AUTHOR_TYPE}" != "User" ]]; then
            echo "DCO certification requires a human-authored pull request" >&2
            exit 1
          fi

          remote_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          pull_ref="refs/pull/${PULL_REQUEST_NUMBER}/head"
          tracking_ref="refs/remotes/pull/${PULL_REQUEST_NUMBER}/head"
          git fetch --no-tags --no-recurse-submodules "${remote_url}" \
            "+${pull_ref}:${tracking_ref}"

          fetched_commit="$(git rev-parse --verify "${tracking_ref}^{commit}")"
          if [[ "${fetched_commit}" != "${HEAD_COMMIT}" ]]; then
            echo "fetched pull-request head does not match the event payload" >&2
            exit 2
          fi

      - name: Verify DCO sign-offs
        id: dco
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "${BASE_COMMIT}" "${HEAD_COMMIT}"

      - name: Publish the head-commit DCO status
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          DCO_OUTCOME: ${{ steps.dco.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ ! "${HEAD_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid pull-request head commit" >&2
            exit 2
          fi

          state="failure"
          description="DCO verification did not complete successfully"
          if [[ "${CHECKOUT_OUTCOME}" == "success" && \
                "${FETCH_OUTCOME}" == "success" && \
                "${DCO_OUTCOME}" == "success" ]]; then
            state="success"
            description="Every pull-request commit has a matching DCO sign-off"
          fi

          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_COMMIT}" \
            -f state="${state}" \
            -f context="DCO / signoff" \
            -f description="${description}" \
            -f target_url="${target_url}"
