name: Non-security bug report
description: Report a reproducible defect that is safe to discuss publicly.
title: "[Bug]: "
labels:
  - "type: implementation"
body:
  - type: markdown
    attributes:
      value: "Do not use this form for security vulnerabilities. Follow SECURITY.md instead."
  - type: textarea
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, kernel, architecture, Rust version, and relevant test profile. Remove personal paths and identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or fixtures
      description: Do not include secrets, raw attestation identities, player data, or unrelated system information.
