id: OGIR-PROTOCOL-FRESHNESS-001
title: Roll back time or remove verifier freshness state
attacker: A5
owner: initial-maintainer
required_assurance_profile: all-protected-modes
assets:
  - protected_session_authorization
  - verifier_freshness_state
preconditions:
  - the verifier persisted a challenge record and authoritative-time high-water mark
steps:
  - submit an expired challenge while authoritative time is far in the future so the observation must persist
  - restart, present a lower authoritative time, or make replay state missing, corrupt, or unavailable
  - submit a challenge that would otherwise be in-window at the lower time
expected:
  decision: retry
  reason: attestation-unavailable
  automatic_ban: false
invariants:
  - clock rollback never extends validity
  - unavailable security state never falls back to stateless validation
residual_risk:
  - a forward clock jump can cause a fail-closed protected-mode outage
