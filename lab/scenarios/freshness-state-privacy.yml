id: OGIR-PRIVACY-FRESHNESS-001
title: Disclose or over-retain challenge replay state
attacker: A8
assets:
  - player_privacy
  - verifier_freshness_state
preconditions:
  - the verifier registered privacy-sensitive challenge binding and issuance-rate state
steps:
  - >-
    request diagnostic formatting of binding or time leaves, challenges,
    expected contexts, verification requests, replay state, stores, guards,
    or durable-state handles
  - retain replay records beyond challenge expiry or issuance events beyond their rate window
  - keep a reopened handle alive while another handle performs garbage collection
expected:
  decision: deny
  reason: privacy-boundary
  automatic_ban: false
invariants:
  - >-
    default diagnostic output exposes only redaction markers or aggregate
    counts while explicit value access remains confined to trusted functional
    code
  - successful garbage collection deletes replay records at challenge expiry and rate events at the end of their enforcement window
  - garbage collection is visible through every handle to the authoritative durable state
residual_risk:
  - separately exported production backups require an approved finite retention and anti-rollback lifecycle
